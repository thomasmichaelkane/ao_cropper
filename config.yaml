# ┌─────────────────────────────────────────┐
# │           ao_cropper config             │
# └─────────────────────────────────────────┘

# Patient/image-specific — override per run with -a/--axial-length and -m/--mpp
acquisition:
  axial_length: 24.0                  # mm  — patient-specific; affects all degree calculations
  mpp: 0.6                            # µm  — microns per pixel from image acquisition metadata

units:
  crop_size: 55                       # µm  — size of each square crop region
  model_eye_length: 24.0              # mm  — Drasdo & Fowler model eye reference length
  reference_mpd: 291                  # µm/° — microns per degree for the model eye
  max_image_pixels: 1_000_000_000     # raise PIL's safety cap for very large TIFFs

text:
  underscores_in_id_count: 1          # underscores inside the subject ID (e.g. MM_0364 → 1)
  font_size: 48

crosshair:
  colour: white
  length_pixels: 20_000               # full crosshair arm length in image pixels
  mark_width: 15                      # half-width of each degree tick mark in pixels

crop_box:
  colour: red
  hover_colour: yellow
  label_font_size: 48
